name: Check package

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the submitted files
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify the standalone package and generated bundle
        run: python3 scripts/validate.py
      - name: Verify distribution boundaries, regeneration and safe installation
        run: python3 -m unittest discover -s tests -v
